<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Entrar · Secretito</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <main>
    <div class="tarjeta pagina-centrada">
      <div class="pestanas">
        <button class="activa" data-modo="entrar">Entrar</button>
        <button data-modo="registro">Crear cuenta</button>
      </div>
      <form id="formulario" novalidate>
        <label><span>Correo</span><input type="email" name="email" autocomplete="email" required></label>
        <label><span>Contraseña</span><input type="password" name="clave" autocomplete="current-password" minlength="6" required></label>
        <label class="casilla" id="casilla-terminos" hidden>
          <input type="checkbox" name="terminos">
          Confirmo que tengo 18 años o más y que no compartiré ni revenderé el contenido.
        </label>
        <p class="error-form" id="error"></p>
        <button class="boton boton-ancho" id="enviar">Entrar</button>
      </form>
      <div class="listo" id="revisa-correo" hidden>
        <div class="icono-grande">📩</div>
        <h2>Revisa tu correo</h2>
        <p class="suave">Te enviamos un enlace para confirmar tu cuenta. Después vuelve y entra.</p>
      </div>
    </div>
  </main>
  <script type="module" src="js/entrar.js"></script>
</body>
</html>
